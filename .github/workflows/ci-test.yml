name: Test and Lint

# 纯文档改动（markdown / 文档站 / 截图 / LICENSE 等）不会触发跑测试，避免浪费 CI。
# 注意列表里故意不含 .github/workflows/**，因此修改 workflow 自身仍会触发，便于验证 CI 改动。
on:
  push:
    # 限定只响应分支 push。若不加 branches，push tag 时也会触发整套矩阵
    # （tag 发布由 python-publish.yml 负责，见该文件的 on.push.tags）
    branches:
      - '**'
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'screenshots/**'
      - 'llms.txt'
      - 'LICENSE'
      - '.gitignore'
      - '.gitattributes'
      - '.editorconfig'
      - '.github/ISSUE_TEMPLATE/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'screenshots/**'
      - 'llms.txt'
      - 'LICENSE'
      - '.gitignore'
      - '.gitattributes'
      - '.editorconfig'
      - '.github/ISSUE_TEMPLATE/**'
  # 允许在 Actions 页面手动触发（fork 仓库首次启用后便于立即验证）
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows 跑全 Python 版本 × 两种 Qt 绑定
        os: [windows-latest]
        python-version: ['3.7', '3.8', '3.9', '3.10', '3.11', '3.12', '3.13', '3.14']
        qt-binding: ['pyside2', 'pyside6']
        exclude:
          # PySide2 仅支持 Python < 3.11
          - {os: windows-latest, qt-binding: pyside2, python-version: '3.11'}
          - {os: windows-latest, qt-binding: pyside2, python-version: '3.12'}
          - {os: windows-latest, qt-binding: pyside2, python-version: '3.13'}
          - {os: windows-latest, qt-binding: pyside2, python-version: '3.14'}
        include:
          # Linux：只测 PySide6（PySide2 在 Linux 的 wheel 支持不佳）
          - {os: ubuntu-22.04, python-version: '3.8', qt-binding: pyside6}
          - {os: ubuntu-22.04, python-version: '3.10', qt-binding: pyside6}
          - {os: ubuntu-22.04, python-version: '3.12', qt-binding: pyside6}
          - {os: ubuntu-22.04, python-version: '3.14', qt-binding: pyside6}
          # macOS：只测 PySide6（macos-latest 为 arm64，PySide2 无 arm64 wheel；
          # 旧的 Intel runner macos-13 已被 GitHub 逐步淘汰，故不再覆盖 macos + PySide2）
          - {os: macos-latest, python-version: '3.9', qt-binding: pyside6}
          - {os: macos-latest, python-version: '3.12', qt-binding: pyside6}
          - {os: macos-latest, python-version: '3.14', qt-binding: pyside6}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install Linux system libraries
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y xvfb libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 \
          libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
          libxcb-xinerama0 libxcb-cursor0 libgl1 libegl1 libdbus-1-3

    - name: Install dependencies and package
      shell: bash
      run: |
        set -e
        python -m pip install --upgrade pip setuptools wheel
        python -m pip install pytest "pytest-cov>=4.1.0" "pytest-qt>=4.2.0,<4.5.0"
        if [ "${{ matrix.qt-binding }}" = "pyside2" ]; then
          python -m pip install "PySide2==5.15.2.*"
        else
          # 不固定版本：由 pip 按当前 Python 版本选择兼容的 PySide6
          # （3.13 需 >=6.8，3.14 需 >=6.10）
          python -m pip install "PySide6"
        fi
        python -m pip install -e .
        python -c "import Qt; print('binding:', Qt.__binding__, '| Qt version:', Qt.__qt_version__)"

    - name: Run tests
      shell: bash
      env:
        # 无显示环境（CI）下使用 offscreen 平台
        QT_QPA_PLATFORM: offscreen
      run: |
        python -m pytest tests -v --cov=dayu_widgets --cov-report=xml

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v5
      continue-on-error: true
      with:
        file: ./coverage.xml
        flags: unittests
        fail_ci_if_error: false

  # DCC（Maya / Blender）集成测试依赖 Docker 镜像，在 fork 上不保证可用，
  # 因此标记 continue-on-error，避免影响主测试与 README 的 CI 徽章状态。
  maya-test:
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        maya-version: ['2022', '2023', '2024', '2025']
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.9
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'
    - name: Set up Docker
      uses: docker/setup-buildx-action@v3
    - name: Install nox
      run: python -m pip install nox
    - name: Run Maya tests
      env:
        MAYA_VERSION: ${{ matrix.maya-version }}
      run: nox -s maya-test

  blender-test:
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.10']
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Set up Docker
      uses: docker/setup-buildx-action@v3
    - name: Install nox
      run: python -m pip install nox
    - name: Run Blender tests
      run: nox -s blender-test
