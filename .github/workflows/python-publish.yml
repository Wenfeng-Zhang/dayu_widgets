name: Create GitHub Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      # 创建 Release 需要写 contents 权限
      contents: write
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    # 注意：本 fork 不发布到 PyPI —— `dayu_widgets` 包名属于上游项目
    # (https://pypi.org/project/dayu_widgets/)，fork 无法以同名发布。
    # 因此这里只创建 GitHub Release（带自动生成的 release notes）。
    - name: Create GitHub Release
      run: gh release create "${GITHUB_REF#refs/*/}" --generate-notes
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
